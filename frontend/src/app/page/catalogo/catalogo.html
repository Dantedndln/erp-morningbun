<div class="pantalla-catalogo">
  <header class="barra-cliente">
    <div class="izquierda">
      <span class="marca">MorningBun</span>
      <span class="lema">Mornings. They're always better with Coffee and a sweet bunn</span>
    </div>
    <nav class="acciones">
      <a routerLink="/" class="enlace-barra">Cerrar sesión</a>
    </nav>
  </header>
  <div class="banner"></div>
  <section class="contenido-catalogo">
    <div class="categorias">
      <button class="chip">Café</button>
      <button class="chip">Desayunos</button>
      <button class="chip">Panadería</button>
      <button class="chip">Malteadas</button>
      <button class="chip">Helados</button>
      <button class="chip">Granos</button>
      <button class="chip">Extras</button>
    </div>
    <div class="buscador">
      <input type="text" placeholder="Buscar producto...">
    </div>
    <div class="galeria">
      @for (producto of productos(); track producto.id){
        <article class="tarjeta-producto">
        <img class="imagen" [src]="'/' + producto.imagen" [alt] = "producto.nombre">
        <div class="datos">
          <p class="nombre">{{ producto.nombre }}</p>
          <div class="fila-precio">
            <span class="precio">{{producto.precio}}</span>
            <button class="btn-agregar">+</button>
          </div>
        </div>
      </article>
      }
    </div>
    <div class="fila-boton">
      <button class="btn-principal">Mi carrito</button>
    </div>
  </section>
</div>
