<div class="pantalla-auth">
  <header class="barra-superior">
    <h1 class="marca">MorningBun</h1>
  </header>

  <div class="centrado">
    <section class="tarjeta">
      <h2 class="titulo-form">Login</h2>

      <label for="usuario">Usuario:</label>
      <input type="text" id="usuario" name="usuario">

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password">

      <a routerLink="/contabilidad" class="btn-form">Iniciar sesión</a>

      <p class="enlace-secundario">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
      </p>
    </section>
  </div>
</div>
